name: tamil_default
match: {language: ta}
priority: 0
# ---- pipeline config (paste from the builder) ----
readers:
  pdf: {impl: pymupdf}
  docx: {impl: python_docx}
  doc: {impl: libreoffice, then: python_docx}
  pptx: {impl: python_pptx}
  odt: {impl: odfpy}
  rtf: {impl: rtf}
  txt: {impl: plain}
  md: {impl: plain}
  html: {impl: html}
  image: {impl: cached_ocr}
roles:
  ocr: {impl: paddleocr, langs: [ta, en]}
quiz:
  types: [mcq_single]
